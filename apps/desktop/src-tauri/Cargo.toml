[workspace]

[package]
name = "step-code-desktop"
version = "0.1.0"
description = "Step Code desktop app (Tauri)"
authors = ["lubeilin"]
edition = "2024"
license = "MIT"

[lib]
name = "step_code_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "tracing-log"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
step-harness-coding-agent = { path = "../../../crates/coding-agent" }
step-harness-agent-core = { path = "../../../crates/agent-core" }
step-harness-providers = { path = "../../../crates/providers" }
async-trait = "0.1"
tokio-util = "0.7"
open = "5"
rfd = "0.15"
rusqlite = { version = "0.40.2", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
log = "0.4"

[features]
default = []
# This feature is used for production builds where the frontend is bundled into
# the binary; `tauri dev` serves it from the dev server instead.
custom-protocol = ["tauri/custom-protocol"]
