[package]
name = "step-harness-coding-agent"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Session-level agent runtime: settings, auth, models, permissions, and the AgentSession orchestrator."

[dependencies]
step-harness-agent-core = { workspace = true }
step-harness-providers = { workspace = true }
step-harness-telemetry = { workspace = true }

tokio = { version = "1", features = ["rt", "sync", "time", "macros", "fs", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
async-trait = "0.1"
thiserror = "2"
regex = "1"
log = "0.4"
ignore = "0.4"
globset = "0.4"
shell-words = "1"
dirs = "6"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
eventsource-stream = "0.2.3"
jsonschema = { version = "0.58.6", default-features = false }
url = "2.5.8"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util", "net", "io-util"] }
