[package]
name = "step-harness-providers"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Unified LLM API with automatic model discovery and provider configuration"

[dependencies]
async-openai = { version = "0.42.2", default-features = false, features = ["response-types", "chat-completion-types"] }
async-trait = "0.1.92"
base64 = "0.23.1"
backon = { version = "1.6.0", default-features = false }
httpdate = "1.0.3"
jiter = { version = "0.17.0", default-features = false }
moka = { version = "0.12.16", features = ["sync"] }
eventsource-stream = "0.2.3"
futures = "0.3.34"
jsonschema = { version = "0.58.6", default-features = false }
log = "0.4"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = [
	"json",
	"stream",
	"rustls",
	"http2",
	"charset",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.152", features = ["preserve_order"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt", "sync", "time", "macros", "fs"] }
tokio-util = "0.7.20"
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v7"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "test-util"] }
env_logger = "0.11"
