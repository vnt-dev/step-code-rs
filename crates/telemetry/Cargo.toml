[package]
name = "step-harness-telemetry"
version = "0.84.4"
edition = "2024"
description = "Explicit telemetry contexts, cancellation-safe spans, and typed schema utilities"
license = "MIT"
keywords = ["telemetry", "tracing", "observability"]

[dependencies]
futures-channel = "0.3.34"
futures-util = "0.3.34"
parking_lot = "0.12.5"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.152"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "sync", "time"] }
